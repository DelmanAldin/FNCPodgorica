<!DOCTYPE html>
<html lang="bs">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="theme-color" content="#c2410c"/>
<title>FNC Podgorica</title>
<link rel="manifest" href="manifest.json"/>
<style>
:root{
  --bg:#080808; --card:#111; --card2:#1a1a1a; --border:#252525;
  --accent:#f97316; --accent2:#fb923c; --text:#f1f1f1; --muted:#666;
  --red:#ef4444; --green:#22c55e; --yellow:#eab308;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,sans-serif;min-height:100vh;padding-bottom:3rem}

/* ── HEADER ── */
header{
  background:linear-gradient(135deg,#431407 0%,#7c2d12 50%,#c2410c 100%);
  padding:1rem 1rem 1.1rem;text-align:center;
  position:sticky;top:0;z-index:100;
  border-bottom:1px solid #9a3412;
  box-shadow:0 4px 20px rgba(249,115,22,.2);
}
header h1{font-size:1.5rem;font-weight:800;letter-spacing:1px;text-shadow:0 2px 8px rgba(0,0,0,.5)}
header p{color:#fed7aa;font-size:.78rem;margin-top:.25rem;letter-spacing:.3px}
.btn-mgr{
  position:absolute;top:50%;right:1rem;transform:translateY(-50%);
  background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.2);
  color:#fed7aa;padding:.4rem .75rem;border-radius:.4rem;font-size:.75rem;cursor:pointer;
  backdrop-filter:blur(4px);
}
.btn-mgr:hover{background:rgba(249,115,22,.3)}
.mgr-badge{
  display:none;position:absolute;top:50%;left:1rem;transform:translateY(-50%);
  background:rgba(249,115,22,.2);border:1px solid var(--accent);
  color:var(--accent2);padding:.3rem .65rem;border-radius:.4rem;font-size:.7rem;
}
.mgr-badge.show{display:block}

/* ── NAV ── */
nav{display:flex;background:#0d0d0d;border-bottom:1px solid var(--border);overflow-x:auto}
nav button{
  flex:1;min-width:80px;padding:.75rem .5rem;background:none;border:none;
  color:var(--muted);font-size:.82rem;cursor:pointer;border-bottom:2px solid transparent;
  white-space:nowrap;font-weight:500;transition:.15s;
}
nav button.active{color:var(--accent2);border-color:var(--accent)}
nav button:hover:not(.active){color:var(--text)}

/* ── TABS ── */
.tab{display:none;padding:1rem}
.tab.active{display:block}

/* ── TICKET GRID ── */
.ticket-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:1rem}
.ticket-card{
  background:var(--card);border:1px solid var(--border);border-radius:.875rem;
  overflow:hidden;transition:.2s;
}
.ticket-card:hover{border-color:#333}
.ticket-hdr{
  background:linear-gradient(90deg,#431407,#7c2d12);
  padding:.7rem 1rem;display:flex;align-items:center;justify-content:space-between;
}
.ticket-hdr .name{font-weight:700;font-size:1rem;letter-spacing:.3px}
.score-badge{
  background:var(--accent);color:#fff;font-size:.72rem;font-weight:700;
  padding:.2rem .6rem;border-radius:1rem;
}
.score-badge.zero{background:#333;color:var(--muted)}
.empty-ticket{padding:1.5rem;text-align:center;color:var(--muted);font-size:.85rem}

/* ticket row with photos */
.t-fight-row{
  display:grid;grid-template-columns:1fr 28px 1fr;
  align-items:center;padding:.45rem .75rem;
  border-bottom:1px solid var(--border);gap:.3rem;
}
.t-fight-row:last-child{border-bottom:none}
.t-fighter{display:flex;flex-direction:column;align-items:center;gap:.25rem;text-align:center}
.t-fighter.right{align-items:center}
.t-photo{
  width:46px;height:52px;object-fit:cover;object-position:top;
  border-radius:.4rem;border:2px solid var(--border);
  background:#1a1a1a;
}
.t-photo.picked{border-color:var(--accent);box-shadow:0 0 8px rgba(249,115,22,.4)}
.t-photo.lost{opacity:.25;filter:grayscale(1)}
.t-fname{font-size:.68rem;font-weight:600;line-height:1.2;max-width:80px}
.t-fname.won{color:var(--accent2)}
.t-fname.lost{color:var(--muted)}
.t-fname.picked{color:var(--text)}
.t-fname.dim{color:var(--muted);opacity:.5}
.method-tag{
  font-size:.58rem;padding:.1rem .35rem;border-radius:.3rem;font-weight:700;
  letter-spacing:.3px;margin-top:.1rem;
}
.method-tag.ko{background:#7f1d1d;color:#fca5a5}
.method-tag.sub{background:#4c1d95;color:#c4b5fd}
.method-tag.bod{background:#1e3a5f;color:#93c5fd}
.method-tag.ost{background:#1f2937;color:#9ca3af}
.t-vs{text-align:center;font-size:.6rem;color:var(--muted);font-weight:700}
.t-bnum{font-size:.58rem;color:#444;text-align:center;margin-bottom:.1rem}

/* ── LIVE TAB ── */
.section-hdr{
  display:flex;align-items:center;gap:.5rem;
  font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.8px;
  color:var(--muted);margin-bottom:.85rem;
}
.section-hdr::after{content:'';flex:1;height:1px;background:var(--border)}

.lock-msg{
  text-align:center;padding:3rem 1rem;color:var(--muted);font-size:.9rem;line-height:1.8;
}
.lock-msg strong{color:var(--text)}

/* fight result card */
.fight-card{
  background:var(--card);border:1px solid var(--border);
  border-radius:.875rem;margin-bottom:.85rem;overflow:hidden;
}
.fight-card-hdr{
  padding:.55rem 1rem;background:var(--card2);
  display:flex;justify-content:space-between;align-items:center;
  font-size:.78rem;border-bottom:1px solid var(--border);
}
.fight-card-hdr .fnum{color:var(--muted)}
.done-badge{
  background:#1c2e1c;color:#4ade80;font-size:.68rem;
  padding:.2rem .55rem;border-radius:1rem;font-weight:600;border:1px solid #166534;
}
.pending-badge{color:var(--muted);font-size:.72rem}

.fight-photos{display:grid;grid-template-columns:1fr auto 1fr;gap:.5rem;padding:.85rem .85rem .5rem}
.f-picker{
  background:var(--card2);border:2px solid var(--border);
  border-radius:.6rem;padding:.5rem .4rem .6rem;cursor:pointer;
  text-align:center;transition:.2s;
  display:flex;flex-direction:column;align-items:center;gap:.3rem;
}
.f-picker:hover{border-color:#444}
.f-picker.selected{border-color:var(--accent);background:#431407}
.f-picker img{
  width:100%;max-width:90px;height:105px;object-fit:cover;object-position:top;
  border-radius:.4rem;display:block;background:#1a1a1a;
}
.f-picker .pname{font-size:.78rem;font-weight:700;line-height:1.2;margin-top:.1rem}
.fight-vs{display:flex;align-items:center;justify-content:center}
.vs-text{
  font-size:.85rem;font-weight:800;color:var(--muted);
  background:var(--card2);border:1px solid var(--border);
  width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;
}

.method-row{display:flex;gap:.4rem;padding:.4rem .85rem .85rem;flex-wrap:wrap}
.m-btn{
  flex:1;min-width:68px;padding:.42rem .3rem;
  background:var(--card2);border:1px solid var(--border);
  border-radius:.4rem;color:var(--text);font-size:.74rem;cursor:pointer;text-align:center;transition:.15s;
}
.m-btn:hover{border-color:#444}
.m-btn.selected{border-color:var(--accent);background:#431407;color:var(--accent2);font-weight:700}
.m-btn.sel-ko{border-color:#ef4444;background:#450a0a;color:#fca5a5;font-weight:700}
.m-btn.sel-sub{border-color:#8b5cf6;background:#2e1065;color:#c4b5fd;font-weight:700}
.m-btn.sel-bod{border-color:#3b82f6;background:#172554;color:#93c5fd;font-weight:700}
.m-btn.sel-ost{border-color:#6b7280;background:#111827;color:#9ca3af;font-weight:700}

.save-btn{
  width:calc(100% - 1.7rem);margin:.0 .85rem .85rem;
  padding:.55rem;background:var(--accent);border:none;
  border-radius:.5rem;color:#fff;font-weight:800;cursor:pointer;font-size:.9rem;
  transition:.15s;letter-spacing:.3px;
}
.save-btn:hover{background:var(--accent2)}
.del-btn{
  display:block;text-align:center;background:none;border:none;
  color:var(--red);font-size:.72rem;cursor:pointer;padding:.1rem .4rem .75rem;width:100%;
}
.del-btn:hover{text-decoration:underline}

/* ── TICKET EDITOR (in mgr Live section) ── */
.participant-tabs{display:flex;flex-wrap:wrap;gap:.4rem;margin-bottom:1rem}
.p-tab{
  padding:.4rem .85rem;background:var(--card2);border:1px solid var(--border);
  border-radius:2rem;color:var(--muted);font-size:.8rem;cursor:pointer;transition:.15s;
}
.p-tab:hover{border-color:#444;color:var(--text)}
.p-tab.active{background:#431407;border-color:var(--accent);color:var(--accent2);font-weight:700}

.edit-fight-card{
  background:var(--card);border:1px solid var(--border);
  border-radius:.75rem;margin-bottom:.6rem;overflow:hidden;
}
.edit-fight-hdr{
  padding:.45rem .85rem;background:var(--card2);font-size:.72rem;
  color:var(--muted);border-bottom:1px solid var(--border);
  display:flex;justify-content:space-between;align-items:center;
}
.edit-saved-dot{
  width:7px;height:7px;border-radius:50%;
  background:#166534;display:inline-block;
}
.edit-fight-photos{
  display:grid;grid-template-columns:1fr auto 1fr;gap:.4rem;padding:.65rem .65rem .4rem;
}
.edit-f-btn{
  background:var(--card2);border:2px solid var(--border);
  border-radius:.5rem;padding:.4rem .3rem .45rem;cursor:pointer;
  text-align:center;transition:.2s;display:flex;flex-direction:column;align-items:center;gap:.2rem;
}
.edit-f-btn:hover{border-color:#444}
.edit-f-btn.sel{border-color:var(--accent);background:#431407}
.edit-f-btn img{
  width:100%;max-width:70px;height:80px;object-fit:cover;object-position:top;
  border-radius:.35rem;background:#1a1a1a;display:block;
}
.edit-f-btn .ename{font-size:.7rem;font-weight:600;line-height:1.2;margin-top:.1rem}
.edit-vs{display:flex;align-items:center;justify-content:center;font-size:.75rem;color:var(--muted);font-weight:700}
.edit-method-row{display:flex;gap:.35rem;padding:.35rem .65rem .65rem;flex-wrap:wrap}
.em-btn{
  flex:1;min-width:60px;padding:.35rem .25rem;
  background:var(--card2);border:1px solid var(--border);
  border-radius:.35rem;color:var(--text);font-size:.7rem;cursor:pointer;text-align:center;transition:.15s;
}
.em-btn:hover{border-color:#444}
.em-btn.sel-ko{border-color:#ef4444;background:#450a0a;color:#fca5a5;font-weight:700}
.em-btn.sel-sub{border-color:#8b5cf6;background:#2e1065;color:#c4b5fd;font-weight:700}
.em-btn.sel-bod{border-color:#3b82f6;background:#172554;color:#93c5fd;font-weight:700}
.em-btn.sel-ost{border-color:#6b7280;background:#111827;color:#9ca3af;font-weight:700}

/* ── RESULTS TAB ── */
.podium{display:flex;justify-content:center;align-items:flex-end;gap:.5rem;margin-bottom:1.5rem;padding:.5rem 0}
.podium-slot{
  background:var(--card);border:1px solid var(--border);border-radius:.75rem;
  padding:.75rem .5rem;text-align:center;flex:1;max-width:120px;
}
.podium-slot.first{border-color:var(--yellow);background:#1a1600;order:2;transform:translateY(-8px)}
.podium-slot.second{border-color:#888;background:#141414;order:1}
.podium-slot.third{border-color:#b45309;background:#1a0f00;order:3}
.podium-medal{font-size:1.4rem}
.podium-name{font-size:.82rem;font-weight:700;margin:.25rem 0 .15rem}
.podium-score{font-size:1.5rem;font-weight:800}
.podium-slot.first .podium-score{color:var(--yellow)}
.podium-slot.second .podium-score{color:#aaa}
.podium-slot.third .podium-score{color:#b45309}

.full-table{width:100%;border-collapse:collapse;font-size:.83rem;margin-bottom:1.5rem}
.full-table th{
  padding:.5rem .75rem;background:var(--card2);
  text-align:left;color:var(--muted);font-size:.7rem;
  text-transform:uppercase;letter-spacing:.5px;
}
.full-table td{padding:.5rem .75rem;border-bottom:1px solid var(--border)}
.full-table tr:last-child td{border-bottom:none}
.r1{color:var(--yellow);font-weight:700}
.r2{color:#e5e7eb;font-weight:600}
.r3{color:#b45309}
.tick{color:var(--green)}
.cross{color:var(--red)}

.breakdown-scroll{overflow-x:auto}
.breakdown-table{border-collapse:collapse;font-size:.78rem;min-width:420px;width:100%}
.breakdown-table th{
  padding:.45rem .6rem;background:var(--card2);
  text-align:left;color:var(--muted);font-size:.68rem;text-transform:uppercase;letter-spacing:.4px;
  white-space:nowrap;
}
.breakdown-table td{padding:.45rem .6rem;border-bottom:1px solid var(--border);vertical-align:top}
.breakdown-table tr:last-child td{border-bottom:none}

/* ── MODAL ── */
.modal-overlay{
  display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);
  z-index:200;align-items:center;justify-content:center;
  backdrop-filter:blur(4px);
}
.modal-overlay.open{display:flex}
.modal{
  background:var(--card);border:1px solid var(--border);
  border-radius:1rem;padding:1.5rem;width:90%;max-width:340px;
  box-shadow:0 20px 60px rgba(0,0,0,.6);
}
.modal h3{margin-bottom:.25rem;font-size:1.05rem;font-weight:700}
.modal p{color:var(--muted);font-size:.8rem;margin-bottom:1rem}
.modal input{
  width:100%;padding:.65rem .85rem;background:var(--bg);
  border:1px solid var(--border);border-radius:.5rem;
  color:var(--text);font-size:1.1rem;margin-bottom:.75rem;letter-spacing:.15rem;
}
.modal input:focus{outline:none;border-color:var(--accent)}
.modal-btns{display:flex;gap:.5rem}
.modal-btns button{flex:1;padding:.55rem;border-radius:.5rem;border:none;cursor:pointer;font-size:.9rem;font-weight:700}
.btn-confirm{background:var(--accent);color:#fff}
.btn-confirm:hover{background:var(--accent2)}
.btn-cancel{background:var(--card2);color:var(--text)}
.err-msg{color:var(--red);font-size:.78rem;margin-bottom:.5rem;display:none}

/* ── TOAST ── */
.toast{
  position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%);
  background:#431407;color:#fed7aa;border:1px solid var(--accent);
  padding:.6rem 1.3rem;border-radius:2rem;font-size:.82rem;
  z-index:300;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap;
}
.toast.show{opacity:1}

.section-gap{height:1.5rem}
</style>
</head>
<body>

<header>
  <div class="mgr-badge" id="mgr-badge">⚙ MGR</div>
  <h1>🥊 FNC PODGORICA</h1>
  <p id="subtitle">Učitavanje...</p>
  <button class="btn-mgr" onclick="openMgrModal()">⚙ Mgr</button>
</header>

<nav>
  <button class="active" onclick="showTab('tickets',this)">🎟 Listići</button>
  <button onclick="showTab('live',this)">🔴 Live</button>
  <button onclick="showTab('results',this)">🏆 Rezultati</button>
</nav>

<div id="tab-tickets" class="tab active"></div>
<div id="tab-live" class="tab"></div>
<div id="tab-results" class="tab"></div>

<!-- Pin modal -->
<div class="modal-overlay" id="mgr-modal">
  <div class="modal">
    <h3>🔐 Manager pristup</h3>
    <p>Unesite manager šifru</p>
    <div class="err-msg" id="pin-err">Pogrešna šifra!</div>
    <input type="password" id="pin-input" placeholder="••••••" onkeydown="if(event.key==='Enter')checkPin()"/>
    <div class="modal-btns">
      <button class="btn-confirm" onclick="checkPin()">Potvrdi</button>
      <button class="btn-cancel" onclick="closeMgrModal()">Odustani</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getDatabase, ref, set, remove, onValue } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js';

// ── CONFIG ───────────────────────────────────────────────────
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyDXR9bZD9NqiF5234sDIuYVCjWM7mDbcyE",
  authDomain: "fnc33-1669a.firebaseapp.com",
  databaseURL: "https://fnc33-1669a-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "fnc33-1669a",
  storageBucket: "fnc33-1669a.firebasestorage.app",
  messagingSenderId: "978538777217",
  appId: "1:978538777217:web:cd37904ec4e10fa06adb80"
};
const DB_PATH = 'podgorica';
const MGR_PASSWORD = '100499';

const app = initializeApp(FIREBASE_CONFIG);
const db = getDatabase(app);

// ── DATA ─────────────────────────────────────────────────────
const FIGHTS = [
  {id:'f1',  num:1,  f1:'Kijamet',       f2:'Basbudak',      img1:'kijamet.png',       img2:'basbudak.png'},
  {id:'f2',  num:2,  f1:'Negru',         f2:'Petrenyi',      img1:'negru.png',          img2:'petrenyi.png'},
  {id:'f3',  num:3,  f1:'Politylo',      f2:'Sonmez',        img1:'politylo.png',       img2:'sonmez.png'},
  {id:'f4',  num:4,  f1:'Bubanja',       f2:'Dobrijević',    img1:'bubanja.png',        img2:'dobrijevic.png'},
  {id:'f5',  num:5,  f1:'Sufiev',        f2:'Niedzielski',   img1:'sufiev.png',         img2:'niedzielski.png'},
  {id:'f6',  num:6,  f1:'Dragojević',    f2:'Abdulkadirov',  img1:'dragojevic.png',     img2:'abdulkadirov.png'},
  {id:'f7',  num:7,  f1:'T. Sičaja',     f2:'Stanković',     img1:'tomislavsicaja.png', img2:'stankovic.png'},
  {id:'f8',  num:8,  f1:'Zlatičanin',    f2:'Lupu',          img1:'zlaticanin.png',     img2:'lupu.png'},
  {id:'f9',  num:9,  f1:'I. Sičaja',     f2:'Villalba',      img1:'ivansicaja.png',     img2:'villalba.png'},
  {id:'f10', num:10, f1:'Opačić',        f2:'Soldatkin',     img1:'opacic.png',         img2:'soldatkin.png'},
  {id:'f11', num:11, f1:'Zdravković',    f2:'Vargas',        img1:'zdravkovic.png',     img2:'vargas.png'},
];
const PARTICIPANTS = ['Pule','Dino','Keni','Aladin','Brano','Delman'];
const METHODS = ['KO/TKO','Submission','Bodovi','Ostalo'];

// ── STATE ────────────────────────────────────────────────────
let tickets = {};
let results = {};
let editingFor = PARTICIPANTS[0];

function isManager(){ return sessionStorage.getItem('mgr_auth')==='1'; }

// ── FIREBASE ─────────────────────────────────────────────────
onValue(ref(db, `${DB_PATH}/tickets`), snap => { tickets = snap.val()||{}; renderAll(); });
onValue(ref(db, `${DB_PATH}/results`), snap => { results = snap.val()||{}; renderAll(); });

function savePick(name, fid, winnerIdx, method){
  return set(ref(db, `${DB_PATH}/tickets/${name}/${fid}`), {winnerIdx, method});
}
function saveResult(fid, winnerIdx, method){
  return set(ref(db, `${DB_PATH}/results/${fid}`), {winnerIdx, method});
}
function deleteResult(fid){
  return remove(ref(db, `${DB_PATH}/results/${fid}`));
}

// ── HELPERS ──────────────────────────────────────────────────
function mc(m){ // method css class
  if(m==='KO/TKO')return'ko';
  if(m==='Submission')return'sub';
  if(m==='Bodovi')return'bod';
  return'ost';
}
function methodSelClass(m){
  if(m==='KO/TKO')return'sel-ko';
  if(m==='Submission')return'sel-sub';
  if(m==='Bodovi')return'sel-bod';
  if(m==='Ostalo')return'sel-ost';
  return'';
}
function img(src){
  return `<img src="${src}" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%2270%22 height=%2280%22><rect width=%2270%22 height=%2280%22 fill=%22%23222%22/><text x=%2235%22 y=%2245%22 text-anchor=%22middle%22 fill=%22%23555%22 font-size=%2222%22>?</text></svg>'" alt=""/>`;
}

// ── TABS ─────────────────────────────────────────────────────
window.showTab = function(name, btn){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));
  document.getElementById('tab-'+name).classList.add('active');
  if(btn) btn.classList.add('active');
};

function renderAll(){ renderTickets(); renderLive(); renderResults(); }

// ── TICKETS TAB ──────────────────────────────────────────────
function renderTickets(){
  const el = document.getElementById('tab-tickets');
  let html = '<div class="ticket-grid">';
  for(const name of PARTICIPANTS){
    const t = tickets[name]||{};
    const hasPicks = Object.keys(t).length > 0;
    let pts = 0;
    FIGHTS.forEach(f=>{
      const r = results[f.id], p = t[f.id];
      if(r && p){
        if(p.winnerIdx===r.winnerIdx){ pts++; if(p.method===r.method) pts++; }
      }
    });
    const hasResults = Object.keys(results).length > 0;
    html += `<div class="ticket-card">
      <div class="ticket-hdr">
        <span class="name">🎟 ${name}</span>
        ${hasResults ? `<span class="score-badge${pts===0?' zero':''}">${pts} bod${pts===1?'':'a'}</span>` : ''}
      </div>`;
    if(!hasPicks){
      html += `<div class="empty-ticket">Listić nije popunjen</div>`;
    } else {
      FIGHTS.forEach(f=>{
        const p = t[f.id];
        const r = results[f.id];
        if(!p){ html += `<div class="t-fight-row"><div class="t-vs" style="grid-column:1/4;color:#333;font-size:.65rem">B${f.num} — nije odabrano</div></div>`; return; }
        const pickedF1 = p.winnerIdx===1;
        let f1status='picked', f2status='dim';
        if(!pickedF1){ f1status='dim'; f2status='picked'; }
        if(r){
          f1status = r.winnerIdx===1 ? (pickedF1?'won':'lost') : (pickedF1?'lost':'dim');
          f2status = r.winnerIdx===2 ? (!pickedF1?'won':'lost') : (!pickedF1?'lost':'dim');
        }
        const mclass = mc(p.method);
        html += `<div class="t-fight-row">
          <div class="t-fighter">
            ${img(f.img1)}
            <div class="t-fname ${f1status}">${f.f1}</div>
            ${pickedF1 ? `<span class="method-tag ${mclass}">${p.method}</span>` : ''}
          </div>
          <div class="t-vs"><div class="t-bnum">B${f.num}</div>vs</div>
          <div class="t-fighter right">
            ${img(f.img2)}
            <div class="t-fname ${f2status}">${f.f2}</div>
            ${!pickedF1 ? `<span class="method-tag ${mclass}">${p.method}</span>` : ''}
          </div>
        </div>`;
      });
    }
    html += '</div>';
  }
  html += '</div>';
  el.innerHTML = html;
  // fix img classes after render
  el.querySelectorAll('.t-photo').forEach(i=>{}); // placeholder
}

// ── LIVE TAB ─────────────────────────────────────────────────
function renderLive(){
  const el = document.getElementById('tab-live');
  const mgr = isManager();
  if(!mgr){
    el.innerHTML = `<div class="lock-msg">🔒 Samo manager može unositi rezultate i editovati listiće.<br><br>Pritisni <strong>⚙ Mgr</strong> u zaglavlju i unesi šifru.</div>`;
    return;
  }

  let html = '';

  // ── Ticket editor section ──
  html += `<div class="section-hdr">✏️ Uredi listiće</div>`;
  html += `<div class="participant-tabs">`;
  PARTICIPANTS.forEach(n => {
    const t = tickets[n]||{};
    const complete = Object.keys(t).length === FIGHTS.length;
    html += `<button class="p-tab${n===editingFor?' active':''}" onclick="setEditing('${n}')">${n}${complete?' ✓':''}</button>`;
  });
  html += `</div>`;

  const t = tickets[editingFor]||{};
  FIGHTS.forEach(f=>{
    const p = t[f.id]||{};
    const saved = p.winnerIdx && p.method;
    html += `<div class="edit-fight-card">
      <div class="edit-fight-hdr">
        <span>Borba ${f.num}</span>
        ${saved ? `<span><span class="edit-saved-dot"></span> Sačuvano</span>` : '<span style="color:#444">Nije odabrano</span>'}
      </div>
      <div class="edit-fight-photos">
        <button class="edit-f-btn${p.winnerIdx===1?' sel':''}" onclick="pickWinner('${editingFor}','${f.id}',1)">
          ${img(f.img1)}
          <div class="ename">${f.f1}</div>
        </button>
        <div class="edit-vs">VS</div>
        <button class="edit-f-btn${p.winnerIdx===2?' sel':''}" onclick="pickWinner('${editingFor}','${f.id}',2)">
          ${img(f.img2)}
          <div class="ename">${f.f2}</div>
        </button>
      </div>
      <div class="edit-method-row">
        ${METHODS.map(m => `<button class="em-btn${p.method===m?' '+methodSelClass(m):''}" onclick="pickMethod('${editingFor}','${f.id}','${m}')">${m}</button>`).join('')}
      </div>
    </div>`;
  });

  html += `<div class="section-gap"></div>`;

  // ── Results section ──
  html += `<div class="section-hdr">🔴 Live rezultati</div>`;

  // Use per-fight selection state
  FIGHTS.forEach(f=>{
    const r = results[f.id];
    const sel = window._resSel = window._resSel||{};
    const s = sel[f.id]||{};
    html += `<div class="fight-card">
      <div class="fight-card-hdr">
        <span class="fnum">Borba ${f.num} — ${f.f1} vs ${f.f2}</span>
        ${r ? `<span class="done-badge">✓ ${r.winnerIdx===1?f.f1:f.f2} · ${r.method}</span>` : '<span class="pending-badge">Na čekanju</span>'}
      </div>
      <div class="fight-photos">
        <button class="f-picker${s.winnerIdx===1?' selected':''}" onclick="rSel('${f.id}',1)">
          ${img(f.img1)}
          <div class="pname">${f.f1}</div>
        </button>
        <div class="fight-vs"><div class="vs-text">VS</div></div>
        <button class="f-picker${s.winnerIdx===2?' selected':''}" onclick="rSel('${f.id}',2)">
          ${img(f.img2)}
          <div class="pname">${f.f2}</div>
        </button>
      </div>
      <div class="method-row">
        ${METHODS.map(m=>`<button class="m-btn${s.method===m?' '+methodSelClass(m):''}" onclick="rMethod('${f.id}','${m}')">${m}</button>`).join('')}
      </div>
      <button class="save-btn" onclick="doSaveResult('${f.id}')">💾 Sačuvaj rezultat</button>
      ${r ? `<button class="del-btn" onclick="doDelResult('${f.id}')">✕ Obriši rezultat borbe ${f.num}</button>` : ''}
    </div>`;
  });

  el.innerHTML = html;
}

// ── RESULTS TAB ──────────────────────────────────────────────
function renderResults(){
  const el = document.getElementById('tab-results');
  const finished = FIGHTS.filter(f=>results[f.id]);
  const scores = {};
  PARTICIPANTS.forEach(n=>{ scores[n]={w:0,m:0,tot:0}; });
  finished.forEach(f=>{
    const r = results[f.id];
    PARTICIPANTS.forEach(name=>{
      const p = (tickets[name]||{})[f.id];
      if(!p) return;
      if(p.winnerIdx===r.winnerIdx){
        scores[name].w++; scores[name].tot++;
        if(p.method===r.method){ scores[name].m++; scores[name].tot++; }
      }
    });
  });
  const sorted = [...PARTICIPANTS].sort((a,b)=>scores[b].tot-scores[a].tot);

  let html = `<p style="font-size:.72rem;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-bottom:1rem">Završeno ${finished.length} od ${FIGHTS.length} borbi</p>`;

  // Podium (top 3)
  if(finished.length > 0){
    const [s1,s2,s3] = sorted;
    html += `<div class="podium">
      ${s2?`<div class="podium-slot second"><div class="podium-medal">🥈</div><div class="podium-name">${s2}</div><div class="podium-score">${scores[s2].tot}</div></div>`:''}
      ${s1?`<div class="podium-slot first"><div class="podium-medal">🥇</div><div class="podium-name">${s1}</div><div class="podium-score">${scores[s1].tot}</div></div>`:''}
      ${s3?`<div class="podium-slot third"><div class="podium-medal">🥉</div><div class="podium-name">${s3}</div><div class="podium-score">${scores[s3].tot}</div></div>`:''}
    </div>`;
  }

  // Full table
  html += `<table class="full-table"><thead><tr><th>#</th><th>Igrač</th><th>Pobjednik</th><th>Metod</th><th>Ukupno</th></tr></thead><tbody>`;
  sorted.forEach((name,i)=>{
    const s = scores[name];
    const cls = i===0?'r1':i===1?'r2':i===2?'r3':'';
    const medal = ['🥇','🥈','🥉'][i]||(i+1);
    html += `<tr class="${cls}"><td>${medal}</td><td>${name}</td><td>${s.w}</td><td>${s.m}</td><td><strong>${s.tot}</strong></td></tr>`;
  });
  html += '</tbody></table>';

  if(finished.length>0){
    html += `<p style="font-size:.72rem;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-bottom:.75rem">Pregled po borbama</p>`;
    html += `<div class="breakdown-scroll"><table class="breakdown-table"><thead><tr><th>Borba</th>${PARTICIPANTS.map(n=>`<th>${n}</th>`).join('')}</tr></thead><tbody>`;
    finished.forEach(f=>{
      const r = results[f.id];
      const winner = r.winnerIdx===1?f.f1:f.f2;
      html += `<tr><td><strong>${winner}</strong><br><span style="color:var(--muted);font-size:.65rem">${r.method} · B${f.num}</span></td>`;
      PARTICIPANTS.forEach(name=>{
        const p = (tickets[name]||{})[f.id];
        if(!p){ html+=`<td style="color:var(--muted)">–</td>`; return; }
        const wOk = p.winnerIdx===r.winnerIdx;
        const mOk = wOk && p.method===r.method;
        const pname = p.winnerIdx===1?f.f1:f.f2;
        html += `<td><span class="${wOk?'tick':'cross'}">${wOk?'✓':'✗'}</span> ${pname}<br><small style="color:var(--muted)">${p.method}${mOk?' <span class="tick">+M</span>':''}</small></td>`;
      });
      html += '</tr>';
    });
    html += '</tbody></table></div>';
  }

  el.innerHTML = html;
}

// ── MGR ──────────────────────────────────────────────────────
window.openMgrModal = function(){
  if(isManager()){ showToast('Već si prijavljen ✓'); return; }
  document.getElementById('mgr-modal').classList.add('open');
  document.getElementById('pin-input').value='';
  document.getElementById('pin-err').style.display='none';
  setTimeout(()=>document.getElementById('pin-input').focus(),100);
};
window.closeMgrModal = function(){
  document.getElementById('mgr-modal').classList.remove('open');
};
window.checkPin = function(){
  if(document.getElementById('pin-input').value===MGR_PASSWORD){
    sessionStorage.setItem('mgr_auth','1');
    closeMgrModal();
    document.getElementById('mgr-badge').classList.add('show');
    renderAll();
    showToast('Manager pristup odobren ✓');
  } else {
    document.getElementById('pin-err').style.display='block';
  }
};

// ── TICKET EDIT ACTIONS ──────────────────────────────────────
window.setEditing = function(name){
  editingFor = name;
  renderLive();
};

window.pickWinner = function(name, fid, idx){
  if(!isManager()) return;
  const existing = (tickets[name]||{})[fid]||{};
  const method = existing.method||null;
  if(method){
    savePick(name, fid, idx, method).then(()=>showToast(`${name} → Borba ${FIGHTS.find(f=>f.id===fid).num} sačuvano ✓`));
  } else {
    // store just the winner side in local state until method is picked
    if(!tickets[name]) tickets[name]={};
    if(!tickets[name][fid]) tickets[name][fid]={};
    tickets[name][fid].winnerIdx = idx;
    renderLive();
  }
};

window.pickMethod = function(name, fid, method){
  if(!isManager()) return;
  const existing = (tickets[name]||{})[fid]||{};
  const winnerIdx = existing.winnerIdx||null;
  if(winnerIdx){
    savePick(name, fid, winnerIdx, method).then(()=>showToast(`${name} → Borba ${FIGHTS.find(f=>f.id===fid).num} sačuvano ✓`));
  } else {
    if(!tickets[name]) tickets[name]={};
    if(!tickets[name][fid]) tickets[name][fid]={};
    tickets[name][fid].method = method;
    renderLive();
  }
};

// ── RESULT ACTIONS ───────────────────────────────────────────
window._resSel = {};
window.rSel = function(fid, idx){
  if(!window._resSel) window._resSel={};
  if(!window._resSel[fid]) window._resSel[fid]={};
  window._resSel[fid].winnerIdx = idx;
  renderLive();
};
window.rMethod = function(fid, method){
  if(!window._resSel) window._resSel={};
  if(!window._resSel[fid]) window._resSel[fid]={};
  window._resSel[fid].method = method;
  renderLive();
};
window.doSaveResult = function(fid){
  const s = (window._resSel||{})[fid]||{};
  if(!s.winnerIdx){ showToast('Odaberi pobjednika!'); return; }
  if(!s.method){ showToast('Odaberi metod!'); return; }
  saveResult(fid, s.winnerIdx, s.method).then(()=>showToast('Rezultat sačuvan ✓'));
};
window.doDelResult = function(fid){
  deleteResult(fid).then(()=>{ if(window._resSel) delete window._resSel[fid]; showToast('Rezultat obrisan'); });
};

// ── TOAST ────────────────────────────────────────────────────
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2500);
}

// ── SW ───────────────────────────────────────────────────────
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('./sw.js').catch(()=>{});
}

document.getElementById('subtitle').textContent='11 borbi · Podgorica 2026';
if(isManager()) document.getElementById('mgr-badge').classList.add('show');

renderAll();
</script>
</body>
</html>
